name: 毎朝進捗レポート送信

on:
  schedule:
    - cron: '30 22 * * *'  # 毎朝7:30 JST = UTC 22:30（前日）
  workflow_dispatch:        # 手動実行ボタン

# GitHub Pagesへのデプロイに必要な権限
permissions:
  contents: write

jobs:
  send-report:
    runs-on: ubuntu-latest

    steps:
      - name: コードを取得
        uses: actions/checkout@v4

      - name: Node.js セットアップ
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 日本語フォントとChromium依存ライブラリをインストール
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            fonts-noto-cjk \
            libgbm1 \
            libatk1.0-0 \
            libatk-bridge2.0-0 \
            libcups2 \
            libdrm2 \
            libgtk-3-0 \
            libnspr4 \
            libnss3 \
            libxcomposite1 \
            libxdamage1 \
            libxfixes3 \
            libxkbcommon0 \
            libxrandr2 \
            libasound2t64 || sudo apt-get install -y libasound2 || true

      - name: パッケージインストール
        run: npm ci

      - name: 進捗レポートを送信（HTML生成・スクショ・メール）
        env:
          TZ: Asia/Tokyo
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: node sendReport.js

      - name: GitHub Pagesへデプロイ
        run: |
          cd _deploy
          git init
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add index.html
          git commit -m "Deploy dashboard $(TZ=Asia/Tokyo date +'%Y/%m/%d')"
          git push --force \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
            HEAD:gh-pages
