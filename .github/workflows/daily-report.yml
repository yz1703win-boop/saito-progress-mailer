name: 毎朝進捗レポート送信

on:
  schedule:
    - cron: '30 22 * * *'  # 毎朝7:30 JST = UTC 22:30（前日）
  workflow_dispatch:        # 手動実行ボタン

jobs:
  send-report:
    runs-on: ubuntu-latest

    steps:
      - name: コードを取得
        uses: actions/checkout@v4

      - name: Node.js セットアップ
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 日本語フォントとChromium依存ライブラリをインストール
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            fonts-noto-cjk \
            libgbm1 \
            libatk1.0-0 \
            libatk-bridge2.0-0 \
            libcups2 \
            libdrm2 \
            libgtk-3-0 \
            libnspr4 \
            libnss3 \
            libxcomposite1 \
            libxdamage1 \
            libxfixes3 \
            libxkbcommon0 \
            libxrandr2 \
            libasound2t64 || \
          sudo apt-get install -y libasound2 || true

      - name: パッケージインストール
        run: npm ci

      - name: surgeをインストール
        run: npm install -g surge

      - name: 進捗レポートを送信
        env:
          TZ: Asia/Tokyo
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}
        run: node sendReport.js
